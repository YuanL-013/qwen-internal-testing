# Builds the guide and deploys it to GitHub Pages.
#
# Runs automatically on every push to main (and can be triggered manually
# from the Actions tab). Nothing else to run — commit, push, done.
#
# The --base=./ flag is important: it makes every asset URL relative, so the
# guide works on a project page (username.github.io/repo-name/) instead of
# rendering a blank page.

name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (relative base for Pages subpath)
        run: npx vite build --base=./

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
